# Render Blueprint: API (Node web service) + static frontend.
# Database is Neon Postgres — set DATABASE_URL in the dashboard (sync: false).
# Auto-deploys from the `master` branch. See documentation/deploy.md.

services:
  - type: web
    name: ai-calendar-api
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=backend --include-workspace-root --include=dev && npm run build:backend
    startCommand: npm run start:prod --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3600s
      - key: TYPEORM_SYNC
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: ai-calendar-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ai-calendar-web
    runtime: static
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=frontend --include-workspace-root --include=dev && npm run build:frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_API_BASE_URL
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
