# Render Blueprint: API (Node web service) + one static site on one domain.
# The static site is two independent builds served together (see scripts/assemble-site.mjs):
#   landing/ (Next.js static export) owns "/", "/privacy/" and "/en/..."; the React app (frontend/) owns every other path.
# Database is Neon Postgres — set DATABASE_URL in the dashboard (sync: false).
# Auto-deploys from the `master` branch. See documentation/deploy.md.

services:
  - type: web
    name: ai-calendar-api
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=backend --include-workspace-root --include=dev && npm run build:backend
    startCommand: npm run start:prod --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3600s
      # Schema comes from versioned migrations run on boot (backend/src/database/migrations).
      - key: TYPEORM_SYNC
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false
      # Shared with ai-calendar-admin-api, which calls /internal/* with it.
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: ai-calendar-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ai-calendar-web
    runtime: static
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=frontend --include-workspace-root --include=dev && npm run build:site
    staticPublishPath: site
    # Existing files are served first (landing pages, app bundle). Rules apply only to the rest.
    routes:
      - type: redirect
        source: /en
        destination: /en/
      # Ukrainian moved from /uk/ to the root.
      - type: redirect
        source: /uk/*
        destination: /
      - type: redirect
        source: /uk
        destination: /
      - type: rewrite
        source: /*
        destination: /app.html
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_API_BASE_URL
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Signed-out visitors of the app go to the landing at "/".
      - key: REACT_APP_LANDING_URL
        value: /
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Optional: a contact address shown on /privacy/.
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      # Sign-in buttons on the landing; providers without server credentials are hidden at runtime.
      - key: NEXT_PUBLIC_AUTH_PROVIDERS
        value: google,microsoft
      # Canonical origin for the landing (sitemap, canonical, Open Graph). Set to the custom domain later.
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: ai-calendar-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # Same frontend, second free hostname. Points at the home API (local LLM + Piper).
  # Set REACT_APP_API_BASE_URL in the dashboard to that public API origin.
  - type: web
    name: ai-calendar-web-home
    runtime: static
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=frontend --include-workspace-root --include=dev && npm run build:frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_API_BASE_URL
        sync: false

  # Admin API: a separate process with its own port, signing key and CORS origin.
  # Shares only the database with ai-calendar-api and never changes the schema.
  - type: web
    name: ai-calendar-admin-api
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=backend --include-workspace-root --include=dev && npm run build:backend
    startCommand: npm run start:admin-api:prod --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.18.0
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: DATABASE_URL
      - key: INTERNAL_API_TOKEN
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: INTERNAL_API_TOKEN
      - key: CLIENT_API_URL
        fromService:
          name: ai-calendar-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_URL
        fromService:
          name: ai-calendar-admin
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # Admin web app (admin/). Talks only to ai-calendar-admin-api.
  - type: web
    name: ai-calendar-admin
    runtime: static
    branch: master
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=admin --include-workspace-root --include=dev && npm run build:admin
    staticPublishPath: admin/dist
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: REACT_APP_API_BASE_URL
        fromService:
          name: ai-calendar-admin-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
