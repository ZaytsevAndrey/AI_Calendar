name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Playwright 1.63 needs Node >= 20; .nvmrc stays 18.18 for Render.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Backend tests
        run: npm test --workspace=backend

      # Active voice gate (structured pipeline). The 13 historical vnext suites
      # are excluded from `npm test`; see documentation/scheduling-stabilization-progress.md.
      - name: Voice structured tests
        run: npm run test:vnext:structured --workspace=backend

      - name: Backend e2e
        run: npm run test:e2e --workspace=backend
        env:
          JWT_SECRET: e2e-ci-secret
          JWT_EXPIRES_IN: 1h

      - name: Production build
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: http://localhost:3001

      # start:prod runs node dist/main; a file outside src in the build moves it to dist/src/main.js.
      - name: Backend entry point exists
        run: test -f backend/dist/main.js && test -f backend/dist/database/migrations/1761750000000-Baseline.js

      - name: Install Playwright Chromium
        run: npm run playwright:install

      - name: Playwright P0 UI smoke
        run: npm run test:e2e:ui -- p0

  # Two public frontends, one shared source. Render publishes each dist to its own
  # onrender.com hostname; this job fails the push if either bundle does not compile.
  frontend-sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            api: https://ai-calendar-api-fxsw.onrender.com
          - name: home
            api: ${{ vars.LOCAL_API_PUBLIC_URL || 'https://home.invalid' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build ${{ matrix.name }} frontend
        run: npm run build:frontend
        env:
          REACT_APP_API_BASE_URL: ${{ matrix.api }}
