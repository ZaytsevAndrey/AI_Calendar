name: Site (landing + app)

# Builds the public site exactly as Render does: React app + Next.js landing, assembled into site/.
on:
  pull_request:
    paths: ['landing/**', 'frontend/**', 'e2e/**', 'scripts/*site*.mjs', 'render.yaml', '.github/workflows/landing.yml']
  push:
    branches: [develop, master, 'feat/landing-waitlist']
    paths: ['landing/**', 'frontend/**', 'e2e/**', 'scripts/*site*.mjs', 'render.yaml', '.github/workflows/landing.yml']

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install (frontend workspace)
        run: npm ci --workspace=frontend --include-workspace-root --include=dev

      - name: Typecheck landing
        run: cd landing && npm ci && npx tsc --noEmit

      - name: Build site
        run: npm run build:site
        env:
          REACT_APP_API_BASE_URL: https://api.luefy.example
          REACT_APP_LANDING_URL: /
          NEXT_PUBLIC_API_BASE_URL: https://api.luefy.example
          NEXT_PUBLIC_SITE_URL: https://luefy.example
          NEXT_PUBLIC_AUTH_PROVIDERS: google,microsoft

      - name: Check the assembled site
        run: |
          set -e
          test -f site/app.html
          for js in $(grep -o 'src="/[^"]*\.js"' site/app.html | cut -d\" -f2); do test -f "site$js"; done
          for f in site/index.html site/en/index.html; do
            grep -q '<link rel="canonical"' "$f"
            grep -q 'hrefLang="en"' "$f"
            grep -q 'application/ld+json' "$f"
            grep -q 'og:image' "$f"
            grep -q 'location.replace' "$f"
          done
          grep -q '<html lang="uk"' site/index.html
          grep -q '<html lang="en"' site/en/index.html
          test -f site/privacy/index.html && test -f site/en/privacy/index.html
          grep -q 'noindex' site/app.html
          test -f site/sitemap.xml && test -f site/robots.txt && test -f site/manifest.webmanifest
          echo "Site checks passed"

      # TEMPORARY review aid for feat/landing-waitlist: push the assembled site to an orphan branch so it
      # can be inspected without artifact downloads. Remove before merging.
      - name: Publish preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/landing-waitlist'
        run: |
          set -e
          tmp=$(mktemp -d)
          cp -r site "$tmp/site"
          cp landing/package-lock.json "$tmp/" || true
          cd "$tmp"
          git init -q -b landing-preview
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site preview for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" landing-preview

  # The landing moved the app's calendar to /calendar and changed /login. The Playwright auth/nav
  # specs (e2e/tests/p0.auth, p1.auth) cover that too, in the main CI job.
  app-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Frontend unit tests
        run: npm test --workspace=frontend
